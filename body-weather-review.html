<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HALORING · 四种身体天气</title>
  <link rel="icon" href="assets/HALORING_super_symbol_copper.png">
  <link rel="stylesheet" href="body-weather-visuals.css?v=6.6-r11-20260916">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f3;color:#29362b;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1080px;margin:0 auto;padding:42px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}header img{width:180px;height:auto}a{color:#72552a;text-underline-offset:5px}a:focus-visible,input:focus-visible{outline:3px solid #947344;outline-offset:5px}h1{font-size:32px;font-weight:600;margin:0 0 8px}p{color:#596453;margin:0}nav{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:20px 0 28px}label{display:flex;gap:8px;align-items:center;min-height:44px}input{width:18px;height:18px;accent-color:#52664b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{border:1px solid #d9dfd2;border-radius:18px;background:#f0f2eb;padding:24px 28px}.card[data-state=restore]{background:#edf1ee}.card[data-state=active]{background:#f6f1e4;border-color:#e6dac3}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:12px;color:#59684e}.name{display:block;margin-top:12px;font-size:36px;line-height:1.25;font-weight:600}.bw-artwork{width:160px;height:120px}.copy{min-height:54px;margin:14px 0 18px;color:#354433;font-size:17px}.caption{padding-top:14px;border-top:1px solid #cbd2c333;color:#65705d;font-size:12px}.gray .bw-artwork{filter:grayscale(1)}footer{margin-top:24px;font-size:13px;color:#64705d}@media(max-width:640px){main{padding:24px 18px}header img{width:140px}header a{font-size:13px}h1{font-size:26px}.grid{grid-template-columns:1fr}.card{padding:20px}.bw-artwork{width:132px;height:99px}.name{font-size:32px}}
  </style>
</head>
<body><main>
  <header><img src="assets/HALORING_wordmark_with_slogan_ink.png" alt="HALORING · IN TUNE WITH YOU"><a href="index.html?scene=full&amp;v=body-weather-20260914#TOD-01">打开完整交互原型</a></header>
  <h1>四种身体天气</h1><p>休息日、慢行日、平常日、活力日 · 本地设计预览</p>
  <nav aria-label="审阅工具"><label><input type="checkbox" id="gray">黑白查看形状</label><label><input type="checkbox" id="alternate">查看同义备用文案</label></nav>
  <section class="grid" id="cards" aria-label="四种天气对照" aria-live="polite"></section>
  <footer>本页用于对照设计，不是 App 新页面。四种图形均无雨；真实页面一次只展示当前状态，数据不足时不展示天气判断。</footer>
</main>
<script src="body-weather-visuals.js?v=6.6-r11-20260916"></script>
<script>
  const weatherCards=document.getElementById('cards');
  function showWeatherCards(){const alternate=document.getElementById('alternate').checked;weatherCards.innerHTML=HaloBodyWeatherVisuals.keys.map(key=>{const v=HaloBodyWeatherVisuals.get(key,alternate?1:0);return `<article class="card" data-state="${key}"><div class="top"><div><span class="kicker">身体天气 · Body Weather</span><strong class="name">${v.label}</strong></div>${HaloBodyWeatherVisuals.artwork(key)}</div><p class="copy">${v.copy}</p><div class="caption">形象：${v.scene}</div></article>`}).join('');}
  document.getElementById('gray').addEventListener('change',event=>weatherCards.classList.toggle('gray',event.target.checked));
  document.getElementById('alternate').addEventListener('change',showWeatherCards);showWeatherCards();
</script></body></html>
