    // A missing/older module must not leave the local review screen blank.

    (() => {
      function showLoadFailure() {
        const screen = document.getElementById("screen");
        if (!screen || screen.children.length || screen.textContent.trim()) return;
        const panel = document.createElement("section");
        panel.style.cssText = "padding:36px 20px;text-align:center;line-height:1.8";
        const title = document.createElement("h1"); title.textContent = "页面暂未加载完成";

        const retry = document.createElement("button"); retry.type = "button"; retry.className = "primary"; retry.textContent = "重新加载";
        retry.onclick = () => { const url = new URL(location.href); url.searchParams.set("reload", String(Date.now())); location.replace(url.href); };
        panel.append(title, copy, retry); screen.append(panel);
      }
      function scheduleCheck() {
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", showLoadFailure, {once:true});
        else setTimeout(showLoadFailure, 0);
      }
      window.addEventListener("error", event => { if (event.target === window || event.target?.tagName === "SCRIPT") scheduleCheck(); }, true);
      window.addEventListener("unhandledrejection", scheduleCheck);
    })();
